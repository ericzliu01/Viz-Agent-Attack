<svg xmlns="http://www.w3.org/2000/svg" width="708" height="408" viewBox="0 0 708 408" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="708" height="408" fill="#fcfcfb"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker></defs>
<rect x="20" y="20" width="200" height="86" rx="8" fill="#eef4fc" stroke="#e4e3df"/>
<text x="32" y="46" font-size="14" font-weight="600" fill="#0b0b0b">1. CSV file</text>
<text x="32" y="66" font-size="11" fill="#52514e">any Kaggle-style table</text>
<rect x="254" y="20" width="200" height="86" rx="8" fill="#eef4fc" stroke="#e4e3df"/>
<text x="266" y="46" font-size="14" font-weight="600" fill="#0b0b0b">2. Profile columns</text>
<text x="266" y="66" font-size="11" fill="#52514e">measure, category, binary,</text>
<text x="266" y="80" font-size="11" fill="#52514e">year, skip</text>
<rect x="488" y="20" width="200" height="86" rx="8" fill="#eef4fc" stroke="#e4e3df"/>
<text x="500" y="46" font-size="14" font-weight="600" fill="#0b0b0b">3. Pick charts</text>
<text x="500" y="66" font-size="11" fill="#52514e">one per type: bar, stacked,</text>
<text x="500" y="80" font-size="11" fill="#52514e">line, scatter, heatmap</text>
<rect x="488" y="146" width="200" height="86" rx="8" fill="#eef4fc" stroke="#e4e3df"/>
<text x="500" y="172" font-size="14" font-weight="600" fill="#0b0b0b">4. Gates</text>
<text x="500" y="192" font-size="11" fill="#52514e">readable gaps, clear extremum,</text>
<text x="500" y="206" font-size="11" fill="#52514e">n &gt;= 10</text>
<rect x="254" y="146" width="200" height="86" rx="8" fill="#eef4fc" stroke="#e4e3df"/>
<text x="266" y="172" font-size="14" font-weight="600" fill="#0b0b0b">5. Fill MCQ tasks</text>
<text x="266" y="192" font-size="11" fill="#52514e">Amar et al. primitives,</text>
<text x="266" y="206" font-size="11" fill="#52514e">options A-D</text>
<rect x="20" y="146" width="200" height="86" rx="8" fill="#fdf0ea" stroke="#e4e3df"/>
<text x="32" y="172" font-size="14" font-weight="600" fill="#0b0b0b">6. Add attacks</text>
<text x="32" y="192" font-size="11" fill="#52514e">MT on the chart, TM in page or</text>
<text x="32" y="206" font-size="11" fill="#52514e">memory</text>
<rect x="20" y="272" width="200" height="86" rx="8" fill="#f3f2ee" stroke="#e4e3df"/>
<text x="32" y="298" font-size="14" font-weight="600" fill="#0b0b0b">7. Render pages</text>
<text x="32" y="318" font-size="11" fill="#52514e">Vega-Lite, Plotly, Chart.js,</text>
<text x="32" y="332" font-size="11" fill="#52514e">D3</text>
<rect x="254" y="272" width="200" height="86" rx="8" fill="#f3f2ee" stroke="#e4e3df"/>
<text x="266" y="298" font-size="14" font-weight="600" fill="#0b0b0b">8. Agent answers</text>
<text x="266" y="318" font-size="11" fill="#52514e">screenshot, dom,</text>
<text x="266" y="332" font-size="11" fill="#52514e">accessibility, console,</text>
<text x="266" y="346" font-size="11" fill="#52514e">evaluate</text>
<rect x="488" y="272" width="200" height="86" rx="8" fill="#f3f2ee" stroke="#e4e3df"/>
<text x="500" y="298" font-size="14" font-weight="600" fill="#0b0b0b">9. Grade</text>
<text x="500" y="318" font-size="11" fill="#52514e">last line ANSWER: X; bait if</text>
<text x="500" y="332" font-size="11" fill="#52514e">it matches</text>
<line x1="220" y1="63.0" x2="254" y2="63.0" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<line x1="454" y1="63.0" x2="488" y2="63.0" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<line x1="588.0" y1="106" x2="588.0" y2="146" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<line x1="488" y1="189.0" x2="454" y2="189.0" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<line x1="254" y1="189.0" x2="220" y2="189.0" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<line x1="120.0" y1="232" x2="120.0" y2="272" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<line x1="220" y1="315.0" x2="254" y2="315.0" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<line x1="454" y1="315.0" x2="488" y2="315.0" stroke="#898781" stroke-width="2" marker-end="url(#a)"/>
<text x="20" y="382" font-size="11" fill="#898781">Blue: task generation (code only, no LLM). Orange: attack generation. Grey: the experiment.</text>
<text x="20" y="398" font-size="11" fill="#898781">A chart that fails a gate is dropped and the next column combination is tried.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>