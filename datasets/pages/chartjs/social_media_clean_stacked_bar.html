<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chart</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{font-family:sans-serif;margin:20px;}#wrap{width:800px;height:500px;}</style>
</head><body>
<div id="wrap"><canvas id="chart"></canvas></div>
<script>
const DATA = {"labels": ["2024-01", "2024-02", "2024-03", "2024-04", "2024-05", "2024-06", "2024-07", "2024-08", "2024-09", "2024-10", "2024-11"], "datasets": [{"label": "Comments", "data": [95.0, 343.0, 257.0, 992.0, 12819.0, 13746.0, 16.0, 13.0, 0.0, 841.0, 116.0]}, {"label": "Likes", "data": [198.0, 751.0, 1338.0, 2401.0, 31600.0, 48337.0, 40.0, 9.0, 1.0, 1685.0, 249.0]}, {"label": "Shares", "data": [75.0, 116.0, 66.0, 214.0, 3229.0, 8992.0, 1.0, 0.0, 0.0, 624.0, 43.0]}], "title": "Engagement Composition by Month", "xLabel": "Month", "yLabel": "Total engagement"};
const COLORS = ['#4b79b9','#e74c3c','#2ecc71','#f1c40f','#9b59b6','#1abc9c'];
new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: { labels: DATA.labels,
    datasets: DATA.datasets.map((d, i) => ({
      label: d.label, data: d.data,
      backgroundColor: COLORS[i % COLORS.length] })) },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { title: { display: true, text: DATA.title } },
    scales: { x: { stacked: true, title: { display: true, text: DATA.xLabel } },
              y: { stacked: true, title: { display: true, text: DATA.yLabel }, beginAtZero: true } } }
});
</script>
</body></html>
