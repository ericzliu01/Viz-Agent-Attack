});
</script>
<script>
            let c = Chart.getChart('chart');
            let idx = c.data.datasets.findIndex(d => d.label === "United States");
            if (idx !== -1) {
                c.options.scales.y2 = {position:'right',min:0,max:5000}; 
                c.data.datasets[idx].yAxisID = 'y2'; 
                c.update();
            }
