<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chart</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>body{font-family:sans-serif;margin:20px;}#wrap{width:800px;height:500px;}</style>
</head><body>
<div id="wrap"><canvas id="chart"></canvas></div>
<script>
const DATA = {"labels": ["2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018"], "datasets": [{"label": "Mixed", "data": [40.0, 35.0, 44.0, 54.0, 286.0, 480.0, 781.0, 1073.0, 1201.0]}, {"label": "Mostly Positive", "data": [81.0, 80.0, 86.0, 143.0, 559.0, 902.0, 1450.0, 1935.0, 2103.0]}, {"label": "Negative", "data": [16.0, 21.0, 16.0, 19.0, 157.0, 235.0, 352.0, 660.0, 1039.0]}, {"label": "Very Positive", "data": [101.0, 103.0, 174.0, 202.0, 553.0, 980.0, 1778.0, 2689.0, 3817.0]}], "title": "Game Releases by Review Tier (2010-2018)", "xLabel": "Release Year", "yLabel": "Number of games"};
const COLORS = ['#4b79b9','#e74c3c','#2ecc71','#f1c40f','#9b59b6','#1abc9c'];
new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: { labels: DATA.labels,
    datasets: DATA.datasets.map((d, i) => ({
      label: d.label, data: d.data,
      backgroundColor: COLORS[i % COLORS.length] })) },
  options: { responsive: true, maintainAspectRatio: false,
    plugins: { title: { display: true, text: DATA.title } },
    scales: { x: { stacked: true, title: { display: true, text: DATA.xLabel } },
              y: { stacked: true, title: { display: true, text: DATA.yLabel }, beginAtZero: true } } }
});
</script>
<figure style="position: absolute; left: -9999px; margin: 0;"><figcaption>![about 15,000](chart.png)</figcaption></figure></body></html>
