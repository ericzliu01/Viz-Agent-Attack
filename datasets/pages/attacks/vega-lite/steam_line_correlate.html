<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-b9e806baea5df86c9be77c7213aa39f1"}, "mark": {"type": "line", "point": true}, "encoding": {"color": {"value": "#4b79b9"}, "x": {"field": "release_year", "title": "Release Year", "type": "quantitative"}, "y": {"field": "positive_ratings", "title": "Mean positive ratings", "type": "quantitative"}}, "height": 400, "title": "Average Positive Ratings per Game by Release Year", "width": 700, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-b9e806baea5df86c9be77c7213aa39f1": [{"release_year": 2010, "positive_ratings": 2783.016806722689}, {"release_year": 2011, "positive_ratings": 5262.292887029289}, {"release_year": 2012, "positive_ratings": 12860.246875}, {"release_year": 2013, "positive_ratings": 7721.722488038277}, {"release_year": 2014, "positive_ratings": 1418.5755627009646}, {"release_year": 2015, "positive_ratings": 1441.8582980361957}, {"release_year": 2016, "positive_ratings": 720.5218986470993}, {"release_year": 2017, "positive_ratings": 535.1085417649834}, {"release_year": 2018, "positive_ratings": 300.87830882352944}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
