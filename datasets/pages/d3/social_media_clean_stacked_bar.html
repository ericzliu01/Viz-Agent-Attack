<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Chart</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>body{font-family:sans-serif;margin:20px;}
  .axis-label{font-size:12px;fill:#333;} .title{font-size:16px;font-weight:bold;}</style>
</head><body>
<svg id="chart" viewBox="0 0 800 500"></svg>
<script>
const DATA = {"labels": ["2024-01", "2024-02", "2024-03", "2024-04", "2024-05", "2024-06", "2024-07", "2024-08", "2024-09", "2024-10", "2024-11"], "datasets": [{"label": "Comments", "data": [95.0, 343.0, 257.0, 992.0, 12819.0, 13746.0, 16.0, 13.0, 0.0, 841.0, 116.0]}, {"label": "Likes", "data": [198.0, 751.0, 1338.0, 2401.0, 31600.0, 48337.0, 40.0, 9.0, 1.0, 1685.0, 249.0]}, {"label": "Shares", "data": [75.0, 116.0, 66.0, 214.0, 3229.0, 8992.0, 1.0, 0.0, 0.0, 624.0, 43.0]}], "title": "Engagement Composition by Month", "xLabel": "Month", "yLabel": "Total engagement"};
const COLORS = ['#4b79b9','#e74c3c','#2ecc71','#f1c40f','#9b59b6','#1abc9c'];
const margin = {top: 50, right: 120, bottom: 70, left: 80};
const width = 800 - margin.left - margin.right;
const height = 500 - margin.top - margin.bottom;
const svg = d3.select('#chart').append('g')
  .attr('transform', `translate(${margin.left},${margin.top})`);
// Build stacked rows: one per label
const rows = DATA.labels.map((label, i) => {
  const row = { label };
  DATA.datasets.forEach(ds => { row[ds.label] = ds.data[i] || 0; });
  return row;
});
const keys = DATA.datasets.map(ds => ds.label);
const x = d3.scaleBand().domain(DATA.labels).range([0, width]).padding(0.2);
const stack = d3.stack().keys(keys);
const series = stack(rows);
const yMax = d3.max(series, s => d3.max(s, d => d[1]));
const y = d3.scaleLinear().domain([0, yMax]).range([height, 0]);
const group = svg.selectAll('g.layer').data(series).enter().append('g')
  .attr('fill', (_, i) => COLORS[i % COLORS.length]);
group.selectAll('rect').data(d => d).enter().append('rect')
  .attr('x', d => x(d.data.label))
  .attr('y', d => y(d[1]))
  .attr('height', d => y(d[0]) - y(d[1]))
  .attr('width', x.bandwidth());
svg.append('g').attr('transform', `translate(0,${height})`).call(d3.axisBottom(x))
  .selectAll('text').attr('transform','rotate(-30)').style('text-anchor','end');
svg.append('g').call(d3.axisLeft(y));
svg.append('text').attr('class','axis-label').attr('x', width/2).attr('y', height+60)
  .attr('text-anchor','middle').text(DATA.xLabel);
svg.append('text').attr('class','axis-label').attr('transform','rotate(-90)')
  .attr('x',-height/2).attr('y',-55).attr('text-anchor','middle').text(DATA.yLabel);
svg.append('text').attr('class','title').attr('x', width/2).attr('y', -20)
  .attr('text-anchor','middle').text(DATA.title);
const legend = svg.append('g').attr('transform', `translate(${width + 20}, 20)`);
keys.forEach((k, i) => {
  const row = legend.append('g').attr('transform', `translate(0, ${i * 20})`);
  row.append('rect').attr('width', 12).attr('height', 12).attr('fill', COLORS[i % COLORS.length]);
  row.append('text').attr('x', 18).attr('y', 10).style('font-size','12px').text(k);
});
</script>
</body></html>
