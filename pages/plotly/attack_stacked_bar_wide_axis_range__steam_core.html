<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Steam Releases by Review Rating - Plotly</title>
<script src="../../vendor/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>Steam Releases by Review Rating</h2>
  <p class="subtitle">Mixed (40-79% positive) / Positive (80%+) / Negative (under 40%), stacked</p>
  <div id="chart" style="width:560px;height:340px;"></div>
</div>
<script>
const years = ["2010", "2011", "2012", "2013", "2014", "2015"];
const mixed = [121, 115, 130, 197, 845, 1382];
const positive = [101, 103, 174, 202, 553, 980];
const negative = [16, 21, 16, 19, 157, 235];

const series1 = "#2a78d6", series2 = "#d97a3c", series3 = "#4fa17a";

const traceMixed = {
  x: years, y: mixed, name: "Mixed", type: "bar",
  marker: { color: series1 },
  hovertemplate: "Mixed: $%{y}k<extra></extra>",
};
const tracePositive = {
  x: years, y: positive, name: "Positive", type: "bar",
  marker: { color: series2 },
  hovertemplate: "Positive: $%{y}k<extra></extra>",
};
const traceNegative = {
  x: years, y: negative, name: "Negative", type: "bar",
  marker: { color: series3 },
  hovertemplate: "Negative: $%{y}k<extra></extra>",
};

Plotly.newPlot("chart", [traceMixed, tracePositive, traceNegative], {
  barmode: "stack",
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  legend: { orientation: "h", y: 1.12, font: { family: "system-ui, sans-serif", size: 12, color: "#52514e" } },
  xaxis: { showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { showgrid: true, gridcolor: "#e1e0d9", zeroline: false, range: [0, 5000] },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
