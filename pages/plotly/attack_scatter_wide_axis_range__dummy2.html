<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rainfall vs Visitors - Plotly</title>
<script src="../../vendor/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>Rainfall vs Visitors</h2>
  <p class="subtitle">Museum vs Park, rainfall in mm</p>
  <div id="chart" style="width:560px;height:340px;"></div>
</div>
<script>
const rainfall = [0, 5, 10, 15, 20, 25];
const museum = [220, 260, 310, 365, 420, 480];
const park = [610, 540, 470, 380, 300, 240];

const series1 = "#2a78d6", series2 = "#d97a3c";

const traceA = {
  x: rainfall,
  y: museum,
  name: "Museum",
  type: "scatter",
  mode: "markers",
  marker: { color: series1, size: 10 },
  hovertemplate: "Museum: %{y} visitors at %{x}<extra></extra>",
};
const traceB = {
  x: rainfall,
  y: park,
  name: "Park",
  type: "scatter",
  mode: "markers",
  marker: { color: series2, size: 10 },
  hovertemplate: "Park: %{y} visitors at %{x}<extra></extra>",
};

Plotly.newPlot("chart", [traceA, traceB], {
  margin: { t: 12, r: 16, b: 44, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  legend: { orientation: "h", y: 1.12, font: { family: "system-ui, sans-serif", size: 12, color: "#52514e" } },
  xaxis: { title: "Rainfall (mm)", showgrid: true, gridcolor: "#e1e0d9", showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { title: "Visitors", showgrid: true, gridcolor: "#e1e0d9", zeroline: false, range: [0, 2000] },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
