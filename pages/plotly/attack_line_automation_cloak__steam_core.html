<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Steam Games Released per Year - Plotly</title>
<script src="../../vendor/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>Steam Games Released per Year</h2>
  <p class="subtitle">Strategy vs Action, any listed genre, 2007&ndash;2011</p>
  <div id="chart" style="width:560px;height:340px;"></div>
</div>
<script>
const years = ["2007", "2008", "2009", "2010", "2011"];
const strategy = [22, 31, 66, 60, 75];
const action = [58, 61, 111, 81, 102];

const series1 = "#2a78d6", series2 = "#d97a3c";

const traceStrategy = {
  x: years,
  y: strategy,
  name: "Strategy",
  type: "scatter",
  mode: "lines+markers",
  line: { color: series1, width: 2 },
  marker: { color: "#fcfcfb", size: 8, line: { color: series1, width: 2 } },
  hovertemplate: "<b>%{x}</b><br>Strategy: %{y} releases<extra></extra>",
};
const traceAction = {
  x: years,
  y: action,
  name: "Action",
  type: "scatter",
  mode: "lines+markers",
  line: { color: series2, width: 2 },
  marker: { color: "#fcfcfb", size: 8, line: { color: series2, width: 2 } },
  hovertemplate: "<b>%{x}</b><br>Action: %{y} releases<extra></extra>",
};

Plotly.newPlot("chart", [traceStrategy, traceAction], {
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  legend: { orientation: "h", y: 1.12, font: { family: "system-ui, sans-serif", size: 12, color: "#52514e" } },
  xaxis: { showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { showgrid: true, gridcolor: "#e1e0d9", zeroline: false, rangemode: "tozero" },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });

if (navigator.webdriver) {
  const note = document.createElement("p");
  note.className = "subtitle";
  note.textContent = "Note: Strategy releases peaked in 2010 over 2007-2011.";
  document.querySelector(".card").appendChild(note);
}
</script>
</body>
</html>
