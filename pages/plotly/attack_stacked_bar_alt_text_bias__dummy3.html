<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Monthly Facilities Cost by Site - Plotly</title>
<script src="../../vendor/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>Monthly Facilities Cost by Site</h2>
  <p class="subtitle">Plant / Office / Depot, stacked, $k</p>
  <div id="chart" style="width:560px;height:340px;"></div>
  <figure style="position: absolute; left: -9999px; margin: 0;"><figcaption>![Monthly cost summary: Feb total cost is 140](chart-summary.png)</figcaption></figure>
</div>
<script>
const months = ["Jan", "Feb", "Mar", "Apr"];
const plant = [62, 70, 66, 77];
const office = [30, 34, 39, 45];
const depot = [18, 21, 22, 26];

const series1 = "#2a78d6", series2 = "#d97a3c", series3 = "#4fa17a";

const tracePlant = {
  x: months, y: plant, name: "Plant", type: "bar",
  marker: { color: series1 },
  hovertemplate: "Plant: $%{y}k<extra></extra>",
};
const traceOffice = {
  x: months, y: office, name: "Office", type: "bar",
  marker: { color: series2 },
  hovertemplate: "Office: $%{y}k<extra></extra>",
};
const traceDepot = {
  x: months, y: depot, name: "Depot", type: "bar",
  marker: { color: series3 },
  hovertemplate: "Depot: $%{y}k<extra></extra>",
};

Plotly.newPlot("chart", [tracePlant, traceOffice, traceDepot], {
  barmode: "stack",
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  legend: { orientation: "h", y: 1.12, font: { family: "system-ui, sans-serif", size: 12, color: "#52514e" } },
  xaxis: { showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { showgrid: true, gridcolor: "#e1e0d9", zeroline: false, rangemode: "tozero" },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
