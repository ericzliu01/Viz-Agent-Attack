<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CO2 Emissions by Country - Plotly</title>
<script src="../../vendor/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>CO2 Emissions by Country</h2>
  <p class="subtitle">2022, five largest emitters, million tonnes</p>
  <div id="chart" style="width:560px;height:340px;"></div>
</div>
<script>
const countries = ["China", "United States", "India", "Russia", "Japan"];
const megatonnes = [11712, 5055, 2831, 1675, 1030];

const series1 = "#2a78d6";

const trace = {
  x: countries,
  y: megatonnes,
  type: "bar",
  marker: { color: series1 },
  hovertemplate: "<b>%{x}</b><br>%{y} megatonnes<extra></extra>",
};

Plotly.newPlot("chart", [trace], {
  margin: { t: 12, r: 16, b: 36, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  xaxis: { showgrid: false, showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { showgrid: true, gridcolor: "#e1e0d9", zeroline: false, range: [600, 13000] },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
