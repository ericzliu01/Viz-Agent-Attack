<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CO2 per Capita by Year - Plotly</title>
<script src="../../vendor/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 12px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>CO2 per Capita by Year</h2>
  <p class="subtitle">China vs Germany, every fourth year, tonnes per person</p>
  <div id="chart" style="width:560px;height:340px;"></div>
</div>
<script>
const year = [2002, 2006, 2010, 2014, 2018, 2022];
const china = [3.19, 4.92, 6.37, 7.19, 7.29, 8.22];
const germany = [10.95, 10.85, 10.23, 9.74, 9.1, 7.94];

const series1 = "#2a78d6", series2 = "#d97a3c";

const traceA = {
  x: year,
  y: china,
  name: "China",
  type: "scatter",
  mode: "markers",
  marker: { color: series1, size: 10 },
  hovertemplate: "China: %{y} tonnes at %{x}<extra></extra>",
};
const traceB = {
  x: year,
  y: germany,
  name: "Germany",
  type: "scatter",
  mode: "markers",
  marker: { color: series2, size: 10 },
  hovertemplate: "Germany: %{y} tonnes at %{x}<extra></extra>",
};

Plotly.newPlot("chart", [traceA, traceB], {
  margin: { t: 12, r: 16, b: 44, l: 48 },
  font: { family: "system-ui, -apple-system, Segoe UI, sans-serif", size: 12, color: "#898781" },
  legend: { orientation: "h", y: 1.12, font: { family: "system-ui, sans-serif", size: 12, color: "#52514e" } },
  xaxis: { tickformat: "d", title: "Year", showgrid: true, gridcolor: "#e1e0d9", showline: true, linecolor: "#c3c2b7", ticks: "" },
  yaxis: { title: "Tonnes", showgrid: true, gridcolor: "#e1e0d9", zeroline: false, range: [0, 40] },
  paper_bgcolor: "#fcfcfb",
  plot_bgcolor: "#fcfcfb",
  hoverlabel: { bgcolor: "#0b0b0b", font: { color: "#ffffff", family: "system-ui, sans-serif", size: 12 } },
}, { displayModeBar: false, responsive: false });
</script>
</body>
</html>
