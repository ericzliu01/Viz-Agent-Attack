<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ad Spend vs Signups - D3</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --series-1: #2a78d6;
    --series-2: #d97a3c;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 12px; }
  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  .grid path { display: none; }
  .axis path, .axis line { stroke: var(--baseline); }
  .axis text { fill: var(--ink-muted); font-size: 11px; }
  .axis-title { fill: var(--ink-secondary); font-size: 12px; }
  .legend text { fill: var(--ink-secondary); font-size: 12px; }
  .tooltip {
    position: absolute; background: var(--ink); color: #fff; padding: 6px 10px;
    border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity 0.1s ease;
  }
</style>
</head>
<body>
<div class="card">
  <h2>Ad Spend vs Signups</h2>
  <p class="subtitle">Campaign A vs Campaign B, spend in $100s</p>
  <svg id="chart" width="504" height="320"></svg>
</div>
<div class="tooltip" id="tooltip"></div>
<script>
const spend = [10, 15, 20, 25, 30, 35];
const groups = [
  { name: "Campaign A", color: "#2a78d6", values: [120, 150, 210, 230, 290, 310] },
  { name: "Campaign B", color: "#d97a3c", values: [300, 280, 260, 255, 230, 210] },
];

const width = 504, height = 320, margin = { top: 32, right: 16, bottom: 44, left: 48 };
const svg = d3.select("#chart");
const x = d3.scaleLinear().domain(d3.extent(spend)).nice().range([margin.left, width - margin.right]);
const yMax = d3.max(groups, g => d3.max(g.values));
const y = d3.scaleLinear().domain([0, yMax]).nice().range([height - margin.bottom, margin.top]);

svg.append("g")
  .attr("class", "grid")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(""));

svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height - margin.bottom})`)
  .call(d3.axisBottom(x).tickSize(0))
  .call(g => g.select(".domain").remove());
svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(${margin.left},0)`)
  .call(d3.axisLeft(y).ticks(5))
  .call(g => g.select(".domain").remove());

svg.append("text").attr("class", "axis-title").attr("text-anchor", "middle")
  .attr("x", (margin.left + width - margin.right) / 2).attr("y", height - 6)
  .text("Ad Spend ($100s)");

const tooltip = d3.select("#tooltip");

groups.forEach(gr => {
  svg.selectAll(`.point-${gr.name.replace(/\s/g, "")}`)
    .data(spend)
    .join("circle")
    .attr("cx", d => x(d))
    .attr("cy", (d, i) => y(gr.values[i]))
    .attr("r", 6)
    .attr("fill", gr.color)
    .on("mouseover", function (event, d) {
      const i = spend.indexOf(d);
      tooltip.style("opacity", 1).text(`${gr.name}: ${gr.values[i]} signups at ${d}`);
    })
    .on("mousemove", function (event) {
      tooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY - 24) + "px");
    })
    .on("mouseout", function () {
      tooltip.style("opacity", 0);
    });
});

const legend = svg.append("g").attr("class", "legend").attr("transform", `translate(${margin.left},14)`);
groups.forEach((gr, i) => {
  const g = legend.append("g").attr("transform", `translate(${i * 120},0)`);
  g.append("circle").attr("r", 5).attr("cy", -4).attr("fill", gr.color);
  g.append("text").attr("x", 10).attr("y", 0).text(gr.name);
});
</script>
</body>
</html>
