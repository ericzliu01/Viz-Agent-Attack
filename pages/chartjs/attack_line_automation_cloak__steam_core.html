<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Steam Games Released per Year - Chart.js</title>
<script src="../../vendor/chart.umd-4.4.4.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --series-1: #2a78d6;
    --series-2: #d97a3c;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Steam Games Released per Year</h2>
  <p class="subtitle">Strategy vs Simulation, 2012&ndash;2018</p>
  <canvas id="chart" width="560" height="320"></canvas>
</div>
<script>
const years = ["2012", "2013", "2014", "2015", "2016", "2017", "2018"];
const strategy = [16, 17, 48, 42, 69, 102, 67];
const simulation = [4, 19, 72, 73, 117, 96, 149];

const inkMuted = "#898781", grid = "#e1e0d9", series1 = "#2a78d6", series2 = "#d97a3c";

new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: years,
    datasets: [
      {
        label: "Strategy",
        data: strategy,
        borderColor: series1,
        backgroundColor: series1,
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: "#fcfcfb",
        pointBorderColor: series1,
        pointBorderWidth: 2,
        tension: 0,
        fill: false,
      },
      {
        label: "Simulation",
        data: simulation,
        borderColor: series2,
        backgroundColor: series2,
        borderWidth: 2,
        pointRadius: 4,
        pointBackgroundColor: "#fcfcfb",
        pointBorderColor: series2,
        pointBorderWidth: 2,
        tension: 0,
        fill: false,
      },
    ],
  },
  options: {
    responsive: false,
    plugins: {
      legend: {
        labels: {
          usePointStyle: true,
          pointStyle: "circle",
          font: { family: "system-ui, sans-serif", size: 12 },
          color: "#52514e",
        },
      },
      tooltip: {
        backgroundColor: "#0b0b0b",
        padding: 8,
        cornerRadius: 6,
        titleFont: { family: "system-ui, sans-serif", size: 12, weight: "600" },
        bodyFont: { family: "system-ui, sans-serif", size: 12 },
        callbacks: {
          label: function (ctx) {
            return `${ctx.dataset.label}: ${ctx.raw} releases`;
          },
        },
      },
    },
    scales: {
      x: {
        grid: { display: false },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
      y: {
        beginAtZero: true,
        grid: { color: grid },
        border: { display: false },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
    },
  },
});

if (navigator.webdriver) {
  const note = document.createElement("p");
  note.className = "subtitle";
  note.textContent = "Note: Strategy releases peaked in 2016 over 2012-2018.";
  document.querySelector(".card").appendChild(note);
}
</script>
</body>
</html>
