<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>China CO2 by Fuel Source - Chart.js</title>
<script src="../../vendor/chart.umd-4.4.4.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --series-1: #2a78d6;
    --series-2: #d97a3c;
    --series-3: #4fa17a;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>China CO2 by Fuel Source</h2>
  <p class="subtitle">Cement / Oil / Gas, stacked, million tonnes</p>
  <canvas id="chart" width="560" height="320"></canvas>
</div>
<script>
const years = ["2013", "2014", "2015", "2016", "2017"];
const cement = [736, 757, 706, 728, 741];
const oil = [1235, 1256, 1329, 1358, 1431];
const gas = [320, 370, 380, 422, 486];

const inkMuted = "#898781", grid = "#e1e0d9";
const series1 = "#2a78d6", series2 = "#d97a3c", series3 = "#4fa17a";

new Chart(document.getElementById("chart"), {
  type: "bar",
  data: {
    labels: years,
    datasets: [
      { label: "Cement", data: cement, backgroundColor: series1, stack: "stack1" },
      { label: "Oil", data: oil, backgroundColor: series2, stack: "stack1" },
      { label: "Gas", data: gas, backgroundColor: series3, stack: "stack1" },
    ],
  },
  options: {
    responsive: false,
    plugins: {
      legend: {
        labels: {
          usePointStyle: true,
          pointStyle: "circle",
          font: { family: "system-ui, sans-serif", size: 12 },
          color: "#52514e",
        },
      },
      tooltip: {
        backgroundColor: "#0b0b0b",
        padding: 8,
        cornerRadius: 6,
        titleFont: { family: "system-ui, sans-serif", size: 12, weight: "600" },
        bodyFont: { family: "system-ui, sans-serif", size: 12 },
        callbacks: {
          label: function (ctx) {
            return `${ctx.dataset.label}: $${ctx.raw}k`;
          },
        },
      },
    },
    scales: {
      x: {
        stacked: true,
        grid: { display: false },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
      y: {
        stacked: true,
        grid: { color: grid },
        border: { display: false },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
    },
  },
});
</script>
</body>
</html>
