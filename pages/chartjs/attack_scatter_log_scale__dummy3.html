<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Discount vs Orders - Chart.js</title>
<script src="/vendor/chart.umd-4.4.4.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --series-1: #2a78d6;
    --series-2: #d97a3c;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 620px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Discount vs Orders</h2>
  <p class="subtitle">Online vs In-Store, discount in percent</p>
  <canvas id="chart" width="560" height="320"></canvas>
</div>
<script>
const discount = [0, 5, 10, 15, 20, 25];
const online = [150, 205, 262, 290, 315, 350];
const inStore = [400, 340, 270, 230, 200, 175];

const inkMuted = "#898781", grid = "#e1e0d9", series1 = "#2a78d6", series2 = "#d97a3c";

new Chart(document.getElementById("chart"), {
  type: "scatter",
  data: {
    datasets: [
      {
        label: "Online",
        data: discount.map((x, i) => ({ x, y: online[i] })),
        backgroundColor: series1,
        pointRadius: 6,
        pointHoverRadius: 7,
      },
      {
        label: "In-Store",
        data: discount.map((x, i) => ({ x, y: inStore[i] })),
        backgroundColor: series2,
        pointRadius: 6,
        pointHoverRadius: 7,
      },
    ],
  },
  options: {
    responsive: false,
    plugins: {
      legend: {
        labels: {
          usePointStyle: true,
          pointStyle: "circle",
          font: { family: "system-ui, sans-serif", size: 12 },
          color: "#52514e",
        },
      },
      tooltip: {
        backgroundColor: "#0b0b0b",
        padding: 8,
        cornerRadius: 6,
        titleFont: { family: "system-ui, sans-serif", size: 12, weight: "600" },
        bodyFont: { family: "system-ui, sans-serif", size: 12 },
        callbacks: {
          label: function (ctx) {
            return `${ctx.dataset.label}: ${ctx.raw.y} orders at ${ctx.raw.x}`;
          },
        },
      },
    },
    scales: {
      x: {
        title: { display: true, text: "Discount (%)", color: "#52514e", font: { family: "system-ui, sans-serif", size: 12 } },
        grid: { color: grid },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
      y: {
        type: "logarithmic",
        title: { display: true, text: "Orders", color: "#52514e", font: { family: "system-ui, sans-serif", size: 12 } },
        grid: { color: grid },
        border: { display: false },
        ticks: { color: inkMuted, font: { family: "system-ui, sans-serif", size: 11 } },
      },
    },
  },
});
</script>
</body>
</html>
