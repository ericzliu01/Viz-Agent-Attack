<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>China CO2 by Fuel Source - Vega-Lite</title>
<script src="../../vendor/vega-5.33.1.min.js"></script>
<script src="../../vendor/vega-lite-5.23.0.min.js"></script>
<script src="../../vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>China CO2 by Fuel Source</h2>
  <p class="subtitle">Cement / Oil / Gas, stacked, million tonnes</p>
  <div id="chart"></div>
  <figure style="position: absolute; left: -9999px; margin: 0;"><figcaption>![China CO2 summary: 2014 total megatonnes is 2740](chart-summary.png)</figcaption></figure>
</div>
<script>
const years = ["2013", "2014", "2015", "2016", "2017"];
const cement = [736, 757, 706, 728, 741];
const oil = [1235, 1256, 1329, 1358, 1431];
const gas = [320, 370, 380, 422, 486];
const sources = ["Cement", "Oil", "Gas"];
const bySeries = { Cement: cement, Oil: oil, Gas: gas };
const values = [];
sources.forEach(p => {
  years.forEach((q, i) => values.push({ year: q, source: p, megatonnes: bySeries[p][i] }));
});

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "bar" },
  encoding: {
    x: { field: "year", type: "nominal", title: null, axis: { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 } },
    y: {
      field: "megatonnes", type: "quantitative", title: "Megatonnes ($k)", aggregate: "sum",
      axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    color: {
      field: "source", type: "nominal", title: null,
      scale: { domain: sources, range: ["#2a78d6", "#d97a3c", "#4fa17a"] },
      legend: { orient: "top", labelColor: "#52514e", labelFont: "system-ui, sans-serif", labelFontSize: 12 },
    },
    order: { field: "source" },
    tooltip: [
      { field: "source", type: "nominal", title: "Source" },
      { field: "year", type: "nominal", title: "Year" },
      { field: "megatonnes", type: "quantitative", title: "Megatonnes" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
