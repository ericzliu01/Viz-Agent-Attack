<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CO2 Emissions by Country - Vega-Lite</title>
<script src="../../vendor/vega-5.33.1.min.js"></script>
<script src="../../vendor/vega-lite-5.23.0.min.js"></script>
<script src="../../vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>CO2 Emissions by Country</h2>
  <p class="subtitle">2022, five largest emitters, million tonnes</p>
  <div id="chart"></div>
</div>
<script>
const values = [
  { country: "China", megatonnes: 11712 },
  { country: "United States", megatonnes: 5055 },
  { country: "India", megatonnes: 2831 },
  { country: "Russia", megatonnes: 1675 },
  { country: "Japan", megatonnes: 1030 },
];

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "bar", cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4 },
  encoding: {
    x: { field: "country", type: "nominal", title: null, axis: { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 } },
    y: {
      field: "megatonnes", type: "quantitative", title: "Megatonnes",
      axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    color: {
      condition: { test: "datum.country === 'United States'", value: "#c94a3c" },
      value: "#2a78d6",
    },
    tooltip: [
      { field: "country", type: "nominal", title: "Country" },
      { field: "megatonnes", type: "quantitative", title: "Megatonnes" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
