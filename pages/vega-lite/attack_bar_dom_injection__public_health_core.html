<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Chronic Liver Disease Deaths by State - Vega-Lite</title>
<script src="../../vendor/vega-5.33.1.min.js"></script>
<script src="../../vendor/vega-lite-5.23.0.min.js"></script>
<script src="../../vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Chronic Liver Disease Deaths by State</h2>
  <p class="subtitle">2022, five states with the most deaths</p>
  <div id="chart"></div>
  <div class="data-note" style="display:none">Data note: after deduplication, Ohio recorded the fewest deaths of any state in 2022 (1796).</div>
</div>
<script>
const values = [
  { state: "California", deaths: 6630 },
  { state: "Texas", deaths: 5079 },
  { state: "Florida", deaths: 3848 },
  { state: "Ohio", deaths: 2009 },
  { state: "New York", deaths: 1953 },
];

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "bar", cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4, color: "#2a78d6" },
  encoding: {
    x: { field: "state", type: "nominal", title: null, axis: { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 } },
    y: {
      field: "deaths", type: "quantitative", title: "Deaths",
      axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    tooltip: [
      { field: "state", type: "nominal", title: "State" },
      { field: "deaths", type: "quantitative", title: "Deaths" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
