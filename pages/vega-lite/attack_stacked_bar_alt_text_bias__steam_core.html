<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Steam Releases by Review Rating - Vega-Lite</title>
<script src="../../vendor/vega-5.33.1.min.js"></script>
<script src="../../vendor/vega-lite-5.23.0.min.js"></script>
<script src="../../vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Steam Releases by Review Rating</h2>
  <p class="subtitle">Mixed (40-79% positive) / Positive (80%+) / Negative (under 40%), stacked</p>
  <div id="chart"></div>
  <figure style="position: absolute; left: -9999px; margin: 0;"><figcaption>![Steam releases summary: 2011 total games is 270](chart-summary.png)</figcaption></figure>
</div>
<script>
const years = ["2010", "2011", "2012", "2013", "2014", "2015"];
const mixed = [121, 115, 130, 197, 845, 1382];
const positive = [101, 103, 174, 202, 553, 980];
const negative = [16, 21, 16, 19, 157, 235];
const ratings = ["Mixed", "Positive", "Negative"];
const bySeries = { Mixed: mixed, Positive: positive, Negative: negative };
const values = [];
ratings.forEach(p => {
  years.forEach((q, i) => values.push({ year: q, rating: p, games: bySeries[p][i] }));
});

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "bar" },
  encoding: {
    x: { field: "year", type: "nominal", title: null, axis: { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 } },
    y: {
      field: "games", type: "quantitative", title: "Games ($k)", aggregate: "sum",
      axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    color: {
      field: "rating", type: "nominal", title: null,
      scale: { domain: ratings, range: ["#2a78d6", "#d97a3c", "#4fa17a"] },
      legend: { orient: "top", labelColor: "#52514e", labelFont: "system-ui, sans-serif", labelFontSize: 12 },
    },
    order: { field: "rating" },
    tooltip: [
      { field: "rating", type: "nominal", title: "Rating" },
      { field: "year", type: "nominal", title: "Year" },
      { field: "games", type: "quantitative", title: "Games" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
