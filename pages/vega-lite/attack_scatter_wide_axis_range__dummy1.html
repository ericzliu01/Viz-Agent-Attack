<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Temperature vs Cups Sold - Vega-Lite</title>
<script src="../../vendor/vega-5.33.1.min.js"></script>
<script src="../../vendor/vega-lite-5.23.0.min.js"></script>
<script src="../../vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Temperature vs Cups Sold</h2>
  <p class="subtitle">Iced Tea vs Hot Cocoa, temperature in degrees Celsius</p>
  <div id="chart"></div>
</div>
<script>
const temperature = [10, 14, 18, 22, 26, 30];
const icedTea = [40, 62, 85, 118, 150, 190];
const hotCocoa = [175, 150, 128, 110, 82, 60];
const values = [
  ...temperature.map((s, i) => ({ temperature: s, drink: "Iced Tea", cups: icedTea[i] })),
  ...temperature.map((s, i) => ({ temperature: s, drink: "Hot Cocoa", cups: hotCocoa[i] })),
];

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "point", filled: true, size: 90 },
  encoding: {
    x: {
      field: "temperature", type: "quantitative", title: "Temperature (C)",
      axis: { gridColor: "#e1e0d9", domain: false, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    y: {
      field: "cups", type: "quantitative", title: "Cups",
      scale: { domain: [0, 600] },
      axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    color: {
      field: "drink", type: "nominal", title: null,
      scale: { domain: ["Iced Tea", "Hot Cocoa"], range: ["#2a78d6", "#d97a3c"] },
      legend: { orient: "top", labelColor: "#52514e", labelFont: "system-ui, sans-serif", labelFontSize: 12 },
    },
    tooltip: [
      { field: "drink", type: "nominal", title: "Drink" },
      { field: "temperature", type: "quantitative", title: "Temperature" },
      { field: "cups", type: "quantitative", title: "Cups" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
