<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ad Spend vs Signups - Vega-Lite</title>
<script src="/vendor/vega-5.33.1.min.js"></script>
<script src="/vendor/vega-lite-5.23.0.min.js"></script>
<script src="/vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Ad Spend vs Signups</h2>
  <p class="subtitle">Campaign A vs Campaign B, spend in $100s</p>
  <div id="chart"></div>
</div>
<script>
const spend = [10, 15, 20, 25, 30, 35];
const campaignA = [120, 150, 210, 230, 290, 310];
const campaignB = [300, 280, 260, 255, 230, 210];
const values = [
  ...spend.map((s, i) => ({ spend: s, campaign: "Campaign A", signups: campaignA[i] })),
  ...spend.map((s, i) => ({ spend: s, campaign: "Campaign B", signups: campaignB[i] })),
];

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "point", filled: true, size: 90 },
  encoding: {
    x: {
      field: "spend", type: "quantitative", title: "Ad Spend ($100s)",
      axis: { gridColor: "#e1e0d9", domain: false, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    y: {
      field: "signups", type: "quantitative", title: "Signups",
      scale: { type: "log", domain: [100, 320] },
      axis: { gridColor: "#e1e0d9", domain: false, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    color: {
      field: "campaign", type: "nominal", title: null,
      scale: { domain: ["Campaign A", "Campaign B"], range: ["#2a78d6", "#d97a3c"] },
      legend: { orient: "top", labelColor: "#52514e", labelFont: "system-ui, sans-serif", labelFontSize: 12 },
    },
    tooltip: [
      { field: "campaign", type: "nominal", title: "Campaign" },
      { field: "spend", type: "quantitative", title: "Spend" },
      { field: "signups", type: "quantitative", title: "Signups" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
