<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Annual Revenue by Channel - Vega-Lite</title>
<script src="../../vendor/vega-5.33.1.min.js"></script>
<script src="../../vendor/vega-lite-5.23.0.min.js"></script>
<script src="../../vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Annual Revenue by Channel</h2>
  <p class="subtitle">Retail / Online / Wholesale, stacked, $k</p>
  <div id="chart"></div>
  <figure style="position: absolute; left: -9999px; margin: 0;"><figcaption>![Annual revenue summary: 2022 total revenue is 460](chart-summary.png)</figcaption></figure>
</div>
<script>
const years = ["2021", "2022", "2023", "2024"];
const retail = [210, 225, 218, 240];
const online = [90, 120, 150, 185];
const wholesale = [60, 58, 65, 70];
const channels = ["Retail", "Online", "Wholesale"];
const bySeries = { Retail: retail, Online: online, Wholesale: wholesale };
const values = [];
channels.forEach(p => {
  years.forEach((q, i) => values.push({ year: q, channel: p, revenue: bySeries[p][i] }));
});

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "bar" },
  encoding: {
    x: { field: "year", type: "nominal", title: null, axis: { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 } },
    y: {
      field: "revenue", type: "quantitative", title: "Revenue ($k)", aggregate: "sum",
      axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    color: {
      field: "channel", type: "nominal", title: null,
      scale: { domain: channels, range: ["#2a78d6", "#d97a3c", "#4fa17a"] },
      legend: { orient: "top", labelColor: "#52514e", labelFont: "system-ui, sans-serif", labelFontSize: 12 },
    },
    order: { field: "channel" },
    tooltip: [
      { field: "channel", type: "nominal", title: "Channel" },
      { field: "year", type: "nominal", title: "Year" },
      { field: "revenue", type: "quantitative", title: "Revenue" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
