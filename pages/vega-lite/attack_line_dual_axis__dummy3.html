<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Daily Gym Visits - Vega-Lite</title>
<script src="/vendor/vega-5.33.1.min.js"></script>
<script src="/vendor/vega-lite-5.23.0.min.js"></script>
<script src="/vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Daily Gym Visits</h2>
  <p class="subtitle">Morning vs Evening, Mon&ndash;Sun</p>
  <div id="chart"></div>
</div>
<script>
const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const morning = [205, 221, 240, 236, 291, 262, 274];
const evening = [330, 341, 326, 350, 362, 371, 380];
const morningValues = days.map((day, i) => ({ day, visits: morning[i] }));
const eveningValues = days.map((day, i) => ({ day, visits: evening[i] }));

const series1 = "#2a78d6", series2 = "#d97a3c";

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  layer: [
    {
      data: { values: morningValues },
      mark: { type: "line", point: { filled: true, size: 60 }, strokeWidth: 2, color: series1 },
      encoding: {
        x: { field: "day", type: "nominal", sort: days, title: null, axis: { domain: false, ticks: false, labelColor: "#898781", labelFont: "system-ui, sans-serif", labelFontSize: 12 } },
        y: {
          field: "visits", type: "quantitative", title: "Morning",
          axis: { gridColor: "#e1e0d9", domain: false, tickCount: 5, labelColor: "#898781", titleColor: series1, labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
        },
        tooltip: [
          { field: "day", type: "nominal", title: "Day" },
          { field: "visits", type: "quantitative", title: "Morning" },
        ],
      },
    },
    {
      data: { values: eveningValues },
      mark: { type: "line", point: { filled: true, size: 60 }, strokeWidth: 2, color: series2 },
      encoding: {
        x: { field: "day", type: "nominal", sort: days, title: null },
        y: {
          field: "visits", type: "quantitative", title: "Evening",
          scale: { domain: [0, 3000] },
          axis: { orient: "right", gridColor: "#e1e0d9", domain: false, labelColor: "#898781", titleColor: series2, labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
        },
        tooltip: [
          { field: "day", type: "nominal", title: "Day" },
          { field: "visits", type: "quantitative", title: "Evening" },
        ],
      },
    },
  ],
  resolve: { scale: { y: "independent" } },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
