<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Rainfall vs Visitors - Vega-Lite</title>
<script src="../../vendor/vega-5.33.1.min.js"></script>
<script src="../../vendor/vega-lite-5.23.0.min.js"></script>
<script src="../../vendor/vega-embed-6.29.0.min.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --page: #f9f9f7;
    --ink: #0b0b0b;
    --ink-secondary: #52514e;
    --grid: #e1e0d9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 32px;
  }
  .card {
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--grid);
    border-radius: 12px;
    padding: 24px 28px 20px;
  }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }
</style>
</head>
<body>
<div class="card">
  <h2>Rainfall vs Visitors</h2>
  <p class="subtitle">Museum vs Park, rainfall in mm</p>
  <div id="chart"></div>
</div>
<script>
const rainfall = [0, 5, 10, 15, 20, 25];
const museum = [220, 260, 310, 365, 420, 480];
const park = [610, 540, 470, 380, 300, 240];
const values = [
  ...rainfall.map((s, i) => ({ rainfall: s, venue: "Museum", visitors: museum[i] })),
  ...rainfall.map((s, i) => ({ rainfall: s, venue: "Park", visitors: park[i] })),
];

const spec = {
  $schema: "https://vega.github.io/schema/vega-lite/v5.json",
  width: 480,
  height: 260,
  background: "#fcfcfb",
  data: { values: values },
  mark: { type: "point", filled: true, size: 90 },
  encoding: {
    x: {
      field: "rainfall", type: "quantitative", title: "Rainfall (mm)",
      axis: { gridColor: "#e1e0d9", domain: false, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    y: {
      field: "visitors", type: "quantitative", title: "Visitors",
      scale: { type: "log", domain: [100, 630] },
      axis: { gridColor: "#e1e0d9", domain: false, labelColor: "#898781", titleColor: "#52514e", labelFont: "system-ui, sans-serif", titleFont: "system-ui, sans-serif", labelFontSize: 12, titleFontSize: 12 },
    },
    color: {
      field: "venue", type: "nominal", title: null,
      scale: { domain: ["Museum", "Park"], range: ["#2a78d6", "#d97a3c"] },
      legend: { orient: "top", labelColor: "#52514e", labelFont: "system-ui, sans-serif", labelFontSize: 12 },
    },
    tooltip: [
      { field: "venue", type: "nominal", title: "Venue" },
      { field: "rainfall", type: "quantitative", title: "Rainfall" },
      { field: "visitors", type: "quantitative", title: "Visitors" },
    ],
  },
  config: {
    view: { stroke: null },
    font: "system-ui, -apple-system, Segoe UI, sans-serif",
  },
};

vegaEmbed("#chart", spec, { actions: false });
</script>
</body>
</html>
