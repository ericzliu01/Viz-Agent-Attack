<title>Viz-Agent-Attack Task Review</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--mut:#5b6672;--line:#dde1e6;--acc:#2457c5;--bad:#b3261e;--badbg:#fdecea;--ok:#1e7b3a;--okbg:#e8f5ec}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1c2127;--ink:#e6e9ed;--mut:#9aa5b1;--line:#2d343c;--acc:#7da3f5;--bad:#f2a29c;--badbg:#3a1f1d;--ok:#8fd4a3;--okbg:#17301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px}
h1{font-size:17px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.grp{display:flex;gap:4px;align-items:center}
.grp>span{color:var(--mut);font-size:12px;margin-right:2px}
button.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:3px 11px;cursor:pointer;font:inherit;font-size:13px}
button.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
#count{color:var(--mut);margin-left:auto}
main{max-width:1500px;margin:0 auto;padding:16px 20px 60px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:26px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 10px}
.head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.n{color:var(--mut);min-width:26px;font-variant-numeric:tabular-nums}
.q{flex:1}
.q b{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px}
.tag{border-radius:4px;padding:1px 7px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.tag.atk{background:var(--badbg);color:var(--bad);border-color:transparent;font-family:ui-monospace,Menlo,monospace}
.tag.ans{background:var(--okbg);color:var(--ok);border-color:transparent}
.body{display:none;border-top:1px solid var(--line);padding:12px 14px}
.card.open .body{display:block}
.card.open .caret{transform:rotate(90deg)}
.caret{color:var(--mut);transition:transform .1s;margin-top:2px}
.panes{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.panes.one{grid-template-columns:minmax(0,1fr)}
@media(max-width:900px){.panes{grid-template-columns:1fr}}
.pane{min-width:0}
.pane h4{margin:0 0 4px;font-size:12px;display:flex;justify-content:space-between;gap:8px}
.pane h4 a{color:var(--acc);font-weight:400;text-decoration:none}
.pane.atk h4 span{color:var(--bad)}
iframe{width:100%;height:470px;border:1px solid var(--line);border-radius:6px;background:#fff}
.desc{margin:10px 0 0;color:var(--mut);font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mut)}
</style></head><body>
<header>
<h1>Viz-Agent-Attack — implemented tasks <span style="font-weight:400;color:var(--mut)">(baseline vs. attacked)</span></h1>

 <div class="grp"><button class="chip" id="expand">Expand all attacked</button><button class="chip" id="collapse">Collapse all</button></div>
 <div id="count"></div>
</div></header>
<main id="list"></main>

hose two specific segments\n// hard to tell apart within each bar (Services stays clearly distinct).\n// Legend swatches match the segment colors exactly; tooltip/segment\n// heights are unchanged and accurate.\nconst quarters = [\"Q1\", \"Q2\", \"Q3\", \"Q4\"];\nconst data = [\n  { quarter: \"Q1\", Hardware: 120, Software: 80, Services: 40 },\n  { quarter: \"Q2\", Hardware: 130, Software: 95, Services: 45 },\n  { quarter: \"Q3\", Hardware: 125, Software: 100, Services: 50 },\n  { quarter: \"Q4\", Hardware: 140, Software: 110, Services: 60 },\n];\nconst keys = [\"Hardware\", \"Software\", \"Services\"];\nconst colors = { Hardware: \"#2a78d6\", Software: \"#4f8fe0\", Services: \"#4fa17a\" };\n\nconst width = 504, height = 320, margin = { top: 32, right: 16, bottom: 32, left: 44 };\nconst svg = d3.select(\"#chart\");\nconst x = d3.scaleBand().domain(quarters).range([margin.left, width - margin.right]).padding(0.35);\nconst stacked = d3.stack().keys(keys)(data);\nconst yMax = d3.max(stacked[stacked.length - 1], d => d[1]);\nconst y = d3.scaleLinear().domain([0, yMax]).nice().range([height - margin.bottom, margin.top]);\n\nsvg.append(\"g\")\n  .attr(\"class\", \"grid\")\n  .attr(\"transform\", `translate(${margin.left},0)`)\n  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(\"\"));\n\nsvg.append(\"g\")\n  .attr(\"class\", \"axis\")\n  .attr(\"transform\", `translate(0,${height - margin.bottom})`)\n  .call(d3.axisBottom(x).tickSize(0))\n  .call(g => g.select(\".domain\").remove());\nsvg.append(\"g\")\n  .attr(\"class\", \"axis\")\n  .attr(\"transform\", `translate(${margin.left},0)`)\n  .call(d3.axisLeft(y).ticks(5))\n  .call(g => g.select(\".domain\").remove());\n\nconst tooltip = d3.select(\"#tooltip\");\nconst barWidth = Math.min(x.bandwidth(), 56);\n\nstacked.forEach(series => {\n  svg.selectAll(`.bar-${series.key}`)\n    .data(series)\n    .join(\"rect\")\n    .attr(\"class\", `bar-${series.key}`)\n    .attr(\"x\", d => x(d.data.quarter) + (x.bandwidth() - barWidth) / 2)\n    .attr(\"y\", d => y(d[1]))\n    .attr(\"width\", barWidth)\n    .attr(\"height\", d => y(d[0]) - y(d[1]))\n    .attr(\"fill\", colors[series.key])\n    .on(\"mouseover\", function (event, d) {\n      // Tooltip text matches the bound datum exactly (no deception here).\n      tooltip.style(\"opacity\", 1).text(`${series.key}, ${d.data.quarter}: $${d.data[series.key]}k`);\n    })\n    .on(\"mousemove\", function (event) {\n      tooltip.style(\"left\", (event.pageX + 10) + \"px\").style(\"top\", (event.pageY - 24) + \"px\");\n    })\n    .on(\"mouseout\", function () {\n      tooltip.style(\"opacity\", 0);\n    });\n});\n\n// Legend\nconst legend = svg.append(\"g\").attr(\"class\", \"legend\").attr(\"transform\", `translate(${margin.left},14)`);\nkeys.forEach((k, i) => {\n  const g = legend.append(\"g\").attr(\"transform\", `translate(${i * 110},0)`);\n  g.append(\"rect\").attr(\"width\", 10).attr(\"height\", 10).attr(\"y\", -9).attr(\"fill\", colors[k]);\n  g.append(\"text\").attr(\"x\", 14).attr(\"y\", 0).text(k);\n});\n<\/script>\n<\/body>\n<\/html>\n", "d3/attack_scatter_wide_axis_range.html": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Ad Spend vs Signups - D3 (attack: scatter_wide_axis_range)<\/title>\n<script src=\"https://d3js.org/d3.v7.min.js\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n    --ink-muted: #898781;\n    --grid: #e1e0d9;\n    --baseline: #c3c2b7;\n    --series-1: #2a78d6;\n    --series-2: #d97a3c;\n  }\n  body {\n    font-family: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    background: var(--page);\n    color: var(--ink);\n    margin: 0;\n    padding: 32px;\n  }\n  .card {\n    max-width: 560px;\n    background: var(--surface);\n    border: 1px solid var(--grid);\n    border-radius: 12px;\n    padding: 24px 28px 20px;\n  }\n  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }     border-radius: 12px;\n    padding: 24px 28px 20px;\n  }\n  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }\n  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }\n  .bar { fill: var(--series-1); }\n  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }\n  .grid path { display: none; }\n  .axis path, .axis line { stroke: var(--baseline); }\n  .axis text { fill: var(--ink-muted); font-size: 11px; }\n  .value-label { fill: var(--ink-secondary); font-size: 11px; font-variant-numeric: tabular-nums; text-anchor: middle; }\n  .tooltip {\n    position: absolute; background: var(--ink); color: #fff; padding: 6px 10px;\n    border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0;\n    transition: opacity 0.1s ease;\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h2>Signups by Region<\/h2>\n  <p class=\"subtitle\">past week, five regions<\/p>\n  <svg id=\"chart\" width=\"504\" height=\"300\"><\/svg>\n<\/div>\n<div class=\"tooltip\" id=\"tooltip\"><\/div>\n<script>\n// Ground truth data. Standardized \"bar\" type baseline, reused verbatim\n// across chartjs/d3/plotly/vega-lite so cross-library comparisons use the\n// same dataset.\nconst data = [\n  { region: \"North\", signups: 180 },\n  { region: \"South\", signups: 240 },\n  { region: \"East\", signups: 155 },\n  { region: \"West\", signups: 310 },\n  { region: \"Central\", signups: 205 },\n];\n\nconst width = 504, height = 300, margin = { top: 20, right: 16, bottom: 32, left: 44 };\nconst svg = d3.select(\"#chart\");\nconst x = d3.scaleBand().domain(data.map(d => d.region)).range([margin.left, width - margin.right]).padding(0.35);\nconst y = d3.scaleLinear().domain([0, d3.max(data, d => d.signups)]).nice().range([height - margin.bottom, margin.top]);\n\nsvg.append(\"g\")\n  .attr(\"class\", \"grid\")\n  .attr(\"transform\", `translate(${margin.left},0)`)\n  .call(d3.axisLeft(y).tickSize(-(width - margin.left - margin.right)).tickFormat(\"\"));\n\nsvg.append(\"g\")\n  .attr(\"class\", \"axis\")\n  .attr(\"transform\", `translate(0,${height - margin.bottom})`)\n  .call(d3.axisBottom(x).tickSize(0))\n  .call(g => g.select(\".domain\").remove());\nsvg.append(\"g\")\n  .attr(\"class\", \"axis\")\n  .attr(\"transform\", `translate(${margin.left},0)`)\n  .call(d3.axisLeft(y).ticks(5))\n  .call(g => g.select(\".domain\").remove());\n\nconst tooltip = d3.select(\"#tooltip\");\nconst barWidth = Math.min(x.bandwidth(), 40);\n\nsvg.selectAll(\".bar\")\n  .data(data)\n  .join(\"path\")\n  .attr(\"class\", \"bar\")\n  .attr(\"d\", d => roundedTopBar(x(d.region) + (x.bandwidth() - barWidth) / 2, y(d.signups), barWidth, height - margin.bottom - y(d.signups), 4))\n  .on(\"mouseover\", function (event, d) {\n    // Tooltip text matches the bound datum exactly (no deception here).\n    tooltip.style(\"opacity\", 1).text(`${d.region}: ${d.signups} signups`);\n  })\n  .on(\"mousemove\", function (event) {\n    tooltip.style(\"left\", (event.pageX + 10) + \"px\").style(\"top\", (event.pageY - 24) + \"px\");\n  })\n  .on(\"mouseout\", function () {\n    tooltip.style(\"opacity\", 0);\n  });\n\nsvg.selectAll(\".value-label\")\n  .data(data)\n  .join(\"text\")\n  .attr(\"class\", \"value-label\")\n  .attr(\"x\", d => x(d.region) + x.bandwidth() / 2)\n  .attr(\"y\", d => y(d.signups) - 8)\n  .text(d => d.signups);\n\nfunction roundedTopBar(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h);\n  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;\n}\n<\/script>\n<\/body>\n<\/html>\n", "d3/attack_stacked_bar_wide_axis_range.html": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Quarterly Revenue by Product Line - D3 (attack: stacked_bar_wide_axis_range)<\/title>\n<script src=\"https://d3js.org/d3.v7.min.js\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n ries.key}`)\n    .attr(\"x\", d => x(d.data.quarter) + (x.bandwidth() - barWidth) / 2)\n    .attr(\"y\", d => y(d[1]))\n    .attr(\"width\", barWidth)\n    .attr(\"height\", d => y(d[0]) - y(d[1]))\n    .attr(\"fill\", colors[series.key])\n    .on(\"mouseover\", function (event, d) {\n      // Tooltip text matches the bound datum exactly (no deception here).\n      tooltip.style(\"opacity\", 1).text(`${series.key}, ${d.data.quarter}: $${d.data[series.key]}k`);\n    })\n    .on(\"mousemove\", function (event) {\n      tooltip.style(\"left\", (event.pageX + 10) + \"px\").style(\"top\", (event.pageY - 24) + \"px\");\n    })\n    .on(\"mouseout\", function () {\n      tooltip.style(\"opacity\", 0);\n    });\n});\n\n// Legend\nconst legend = svg.append(\"g\").attr(\"class\", \"legend\").attr(\"transform\", `translate(${margin.left},14)`);\nkeys.forEach((k, i) => {\n  const g = legend.append(\"g\").attr(\"transform\", `translate(${i * 110},0)`);\n  g.append(\"rect\").attr(\"width\", 10).attr(\"height\", 10).attr(\"y\", -9).attr(\"fill\", colors[k]);\n  g.append(\"text\").attr(\"x\", 14).attr(\"y\", 0).text(k);\n});\n<\/script>\n<\/body>\n<\/html>\n", "d3/attack_scatter_log_scale.html": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Ad Spend vs Signups - D3 (attack: scatter_log_scale)<\/title>\n<script src=\"https://d3js.org/d3.v7.min.js\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n    --ink-muted: #898781;\n    --grid: #e1e0d9;\n    --baseline: #c3c2b7;\n    --series-1: #2a78d6;\n    --series-2: #d97a3c;\n  }\n  body {\n    font-family: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    background: var(--page);\n    color: var(--ink);\n    margin: 0;\n    padding: 32px;\n  }\n  .card {\n    max-width: 560px;\n    background: var(--surface);\n    border: 1px solid var(--grid);\n    border-radius: 12px;\n    padding: 24px 28px 20px;\n  }\n  h2 { font-size: 17px; /script>\n<\/body>\n<\/html>\n", "d3/clean_line.html": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Daily Active Users - D3 (clean: multi-series line)<\/title>\n<script src=\"https://d3js.org/d3.v7.min.js\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n    --ink-muted: #898781;\n    --grid: #e1e0d9;\n    --baseline: #c3c2b7;\n    --series-1: #2a78d6;\n    --series-2: #d97a3c;\n  }\n  body {\n    font-family: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    background: var(--page);\n    color: var(--ink);\n    margin: 0;\n    padding: 32px;\n  }\n  .card {\n    max-width: 560px;\n    background: var(--surface);\n    border: 1px solid var(--grid);\n    border-radius: 12px;\n    padding: 24px 28px 20px;\n  }\n  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }\n  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 12px; }\n  .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }\n  .grid path { display: none; }\n  .axis path, .axis line { stroke: var(--baseline); }\n  .axis text { fill: var(--ink-muted); font-size: 11px; }\n  .legend text { fill: var(--ink-secondary); font-size: 12px; }\n  .tooltip {\n    position: absolute; background: var(--ink); color: #fff; padding: 6px 10px;\n    border-radius: 6px; font-size: 12px; pointer-events: none; opacity: 0;\n    transition: opacity 0.1s ease;\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h2>Daily Active Users<\/h2>\n  <p class=\"subtitle\">Mobile vs Desktop, Mon&ndash;Sun<\/p>\n  <svg id=\"chart\" width=\"504\" height=\"320\"><\/svg>\n<\/div>\n<div class=\"tooltip\" id=\"tooltip\"><\/div>\n<script>\n// Ground truth data. Standardized \"multi-series line\" type baseline, reused\n// verbatim across chartjs/d3/plotly/vega-lite so cross-library comparisons\n// use the same dataset.\nconst days = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat ize(0))\n  .call(g => g.select(\".domain\").remove());\nsvg.append(\"g\")\n  .attr(\"class\", \"axis\")\n  .attr(\"transform\", `translate(${margin.left},0)`)\n  .call(d3.axisLeft(y).ticks(5))\n  .call(g => g.select(\".domain\").remove());\n\nconst tooltip = d3.select(\"#tooltip\");\nconst barWidth = Math.min(x.bandwidth(), 40);\n\nsvg.selectAll(\".bar\")\n  .data(data)\n  .join(\"path\")\n  .attr(\"fill\", d => d.region === highlightRegion ? \"var(--decoy)\" : \"var(--series-1)\")\n  .attr(\"d\", d => roundedTopBar(x(d.region) + (x.bandwidth() - barWidth) / 2, y(d.signups), barWidth, height - margin.bottom - y(d.signups), 4))\n  .on(\"mouseover\", function (event, d) {\n    // Tooltip text matches the bound datum exactly (no deception here).\n    tooltip.style(\"opacity\", 1).text(`${d.region}: ${d.signups} signups`);\n  })\n  .on(\"mousemove\", function (event) {\n    tooltip.style(\"left\", (event.pageX + 10) + \"px\").style(\"top\", (event.pageY - 24) + \"px\");\n  })\n  .on(\"mouseout\", function () {\n    tooltip.style(\"opacity\", 0);\n  });\n\nsvg.selectAll(\".value-label\")\n  .data(data)\n  .join(\"text\")\n  .attr(\"class\", \"value-label\")\n  .attr(\"x\", d => x(d.region) + x.bandwidth() / 2)\n  .attr(\"y\", d => y(d.signups) - 8)\n  .text(d => d.signups);\n\nfunction roundedTopBar(x, y, w, h, r) {\n  r = Math.min(r, w / 2, h);\n  return `M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + w - r} Q${x + w},${y} ${x + w},${y + r} V${y + h} Z`;\n}\n<\/script>\n<\/body>\n<\/html>\n", "plotly/attack_stacked_bar_close_colors.html": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Quarterly Revenue by Product Line - Plotly (attack: stacked_bar_close_colors)<\/title>\n<script src=\"https://cdn.plot.ly/plotly-2.35.2.min.js\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n    --grid: #e1e0d9;\n  }\n  body {\n    font-family: system-ui, -apple-system, \"Sego e>\n<script src=\"https://cdn.jsdelivr.net/npm/vega@5\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/vega-lite@5\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/vega-embed@6\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n    --grid: #e1e0d9;\n  }\n  body {\n    font-family: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    background: var(--page);\n    color: var(--ink);\n    margin: 0;\n    padding: 32px;\n  }\n  .card {\n    max-width: 560px;\n    background: var(--surface);\n    border: 1px solid var(--grid);\n    border-radius: 12px;\n    padding: 24px 28px 20px;\n  }\n  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }\n  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h2>Ad Spend vs Signups<\/h2>\n  <p class=\"subtitle\">Campaign A vs Campaign B, spend in $100s<\/p>\n  <div id=\"chart\"><\/div>\n<\/div>\n<script>\n// Ground truth data -- IDENTICAL to clean_scatter.html. Tier A attack:\n// \"inappropriate_use_of_log_scale\" -- the y-axis (a linear/additive\n// quantity, not exponential) uses a log scale, compressing the visual gap\n// between high values and stretching the gap between low values.\n// Tooltip/points are unchanged and accurate.\nconst spend = [10, 15, 20, 25, 30, 35];\nconst campaignA = [120, 150, 210, 230, 290, 310];\nconst campaignB = [300, 280, 260, 255, 230, 210];\nconst values = [\n  ...spend.map((s, i) => ({ spend: s, campaign: \"Campaign A\", signups: campaignA[i] })),\n  ...spend.map((s, i) => ({ spend: s, campaign: \"Campaign B\", signups: campaignB[i] })),\n];\n\nconst spec = {\n  $schema: \"https://vega.github.io/schema/vega-lite/v5.json\",\n  width: 480,\n  height: 260,\n  background: \"#fcfcfb\",\n  data: { values: values },\n  mark: { type: \"point\", filled: true, size: 90 },\n  encoding: {\n    x: {\n      field: \"spend\", type: \"quantitative\", title: \"Ad Spend ($100s)\",\n      axis: { gridColor: \"#e1e0d9\", domain: false, labelColor: \"#898781\", titleColor: \"#52514e\", labelFont: \"system-ui, sans-serif\", titleFont: \"system-ui, sans-serif\", labelFontSize: 12, titleFontSize: 12 },\n    },\n    y: {\n      field: \"signups\", type: \"quantitative\", title: \"Signups\",\n      scale: { type: \"log\", domain: [100, 320] },\n      axis: { gridColor: \"#e1e0d9\", domain: false, labelColor: \"#898781\", titleColor: \"#52514e\", labelFont: \"system-ui, sans-serif\", titleFont: \"system-ui, sans-serif\", labelFontSize: 12, titleFontSize: 12 },\n    },\n    color: {\n      field: \"campaign\", type: \"nominal\", title: null,\n      scale: { domain: [\"Campaign A\", \"Campaign B\"], range: [\"#2a78d6\", \"#d97a3c\"] },\n      legend: { orient: \"top\", labelColor: \"#52514e\", labelFont: \"system-ui, sans-serif\", labelFontSize: 12 },\n    },\n    tooltip: [\n      { field: \"campaign\", type: \"nominal\", title: \"Campaign\" },\n      { field: \"spend\", type: \"quantitative\", title: \"Spend\" },\n      { field: \"signups\", type: \"quantitative\", title: \"Signups\" },\n    ],\n  },\n  config: {\n    view: { stroke: null },\n    font: \"system-ui, -apple-system, Segoe UI, sans-serif\",\n  },\n};\n\nvegaEmbed(\"#chart\", spec, { actions: false });\n<\/script>\n<\/body>\n<\/html>\n", "vega-lite/clean_line.html": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Daily Active Users - Vega-Lite (clean: multi-series line)<\/title>\n<script src=\"https://cdn.jsdelivr.net/npm/vega@5\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/vega-lite@5\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/vega-embed@6\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n    --grid: #e1e0d9;\n  }\n  body {\n    font-family: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    background: var(--page);\n    color: var(--ink);\n    margin: 0;\n    padding: 32px;\n  }\n  .card {\n    max-width: 560px;\n    background: var(--surface);\n    border: 1px solid var(--grid);\n    border-radius: 12px;\n    padding: 24px 28px 20px;\n  }\n  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }\n  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h2>Daily Active Users<\/h2>\n  <p class=\"subtitle\">Mobile vs Desktop, Mon&ndash;Sun<\/p>\n  <div id=\"chart\"><\/div>\n<\/div>\n<script>\n// Ground truth data. Standardized \"multi-series line\" type baseline, reused\n// verbatim across chartjs/d3/plotly/vega-lite so cross-library comparisons\n// use the same dataset.\nconst days = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\", \"Sun\"];\nconst mobile = [820, 860, 910, 890, 950, 1020, 980];\nconst desktop = [640, 655, 630, 670, 690, 705, 715];\nconst values = [\n  ...days.map((day, i) => ({ day, platform: \"Mobile\", users: mobile[i] })),\n  ...days.map((day, i) => ({ day, platform: \"Desktop\", users: desktop[i] })),\n];\n\nconst spec = {\n  $schema: \"https://vega.github.io/schema/vega-lite/v5.json\",\n  width: 480,\n  height: 260,\n  background: \"#fcfcfb\",\n  data: { values: values },\n  mark: { type: \"line\", point: { filled: true, size: 60 }, strokeWidth: 2 },\n  encoding: {\n    x: { field: \"day\", type: \"nominal\", sort: days, title: null, axis: { domain: false, ticks: false, labelColor: \"#898781\", labelFont: \"system-ui, sans-serif\", labelFontSize: 12 } },\n    y: {\n      field: \"users\", type: \"quantitative\", title: \"Active Users\",\n      axis: { gridColor: \"#e1e0d9\", domain: false, tickCount: 5, labelColor: \"#898781\", titleColor: \"#52514e\", labelFont: \"system-ui, sans-serif\", titleFont: \"system-ui, sans-serif\", labelFontSize: 12, titleFontSize: 12 },\n    },\n    color: {\n      field: \"platform\", type: \"nominal\", title: null,\n      scale: { domain: [\"Mobile\", \"Desktop\"], range: [\"#2a78d6\", \"#d97a3c\"] },\n      legend: { orient: \"top\", labelColor: \"#52514e\", labelFont: \"system-ui, sans-serif\", labelFontSize: 12 },\n    },\n    // Tooltip shows the true users field directly (no deception here).\n    tooltip: [\n      { field: \"platform\", type: \"nominal\", title: \"Platform\" },\n      { field: \"day\", type: \"nominal\", title: \"Day\" },\n      { field: \"users\", type: \"quantitative\", title: \"Users\" },\n    ],\n  },\n  config: {\n    view: { stroke: null },\n    font: \"system-ui, -apple-system, Segoe UI, sans-serif\",\n  },\n};\n\nvegaEmbed(\"#chart\", spec, { actions: false });\n<\/script>\n<\/body>\n<\/html>\n", "vega-lite/attack_bar_color_highlight_decoy.html": "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>Signups by Region - Vega-Lite (attack: bar_color_highlight_decoy)<\/title>\n<script src=\"https://cdn.jsdelivr.net/npm/vega@5\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/vega-lite@5\"><\/script>\n<script src=\"https://cdn.jsdelivr.net/npm/vega-embed@6\"><\/script>\n<style>\n  :root {\n    --surface: #fcfcfb;\n    --page: #f9f9f7;\n    --ink: #0b0b0b;\n    --ink-secondary: #52514e;\n    --grid: #e1e0d9;\n  }\n  body {\n    font-family: system-ui, -apple-system, \"Segoe UI\", sans-serif;\n    background: var(--page);\n    color: var(--ink);\n    margin: 0;\n    padding: 32px;\n  }\n  .card {\n    max-width: 560px;\n    background: var(--surface);\n    border: 1px solid var(--grid);\n    border-radius: 12px;\n    padding: 24px 28px 20px;\n  }\n  h2 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }\n  .subtitle { font-size: 13px; color: var(--ink-secondary); margin: 0 0 16px; }\n<\/style>\n<\/head>\n<body>\n<div class=\"card\">\n  <h2>Signups by Region<\/h2>\n  <p class=\"subtitle\">past week, five regions<\/p>\n  <div id=\"chart\"><\/div>\n<\/div>\n<script>\n// Ground truth data -- IDENTICAL to clean_bar.html, true 0-based axis.\n// Tier A attack: \"ineffective_color_scheme\" / color-highlight decoy.\n// South (240, NOT the true anomaly) is drawn in an attention-grabbing\n// accent color while West (310, the true high outlier) stays neutral blue.\n// Tooltip is unchanged and accurate.\nconst values = [\n  { region: \"North\", signups: 180 },\n  { region: \"South\", signups: 240 },\n  { region: \"East\", signups: 155 },\n  { region: \"West\", signups: 310 },\n  { region: \"Central\", signups: 205 },\n];\n\nconst spec = {\n  $schema: \"https://vega.github.io/schema/vega-lite/v5.json\",\n  width: 480,\n  height: 260,\n  background: \"#fcfcfb\",\n  data: { values: values },\n  mark: { type: \"bar\", cornerRadiusTopLeft: 4, cornerRadiusTopRight: 4 },\n  encoding: {\n    x: { field: \"region\", type: \"nominal\", title: null, axis: { domain: false, ticks: false, labelColor: \"#898781\", labelFont: \"system-ui, sans-serif\", labelFontSize: 12 } },\n    y: {\n      field: \"signups\", type: \"quantitative\", title: \"Signups\",\n      axis: { gridColor: \"#e1e0d9\", domain: false, tickCount: 5, labelColor: \"#898781\", titleColor: \"#52514e\", labelFont: \"system-ui, sans-serif\", titleFont: \"system-ui, sans-serif\", labelFontSize: 12, titleFontSize: 12 },\n    },\n    // Per-datum conditional color -- a plausible editorial highlight, not\n    // an inconsistency. No legend is produced since this is a condition on\n    // a constant value, not a bound categorical field.\n    color: {\n      condition: { test: \"datum.region === 'South'\", value: \"#c94a3c\" },\n      value: \"#2a78d6\",\n    },\n    tooltip: [\n      { field: \"region\", type: \"nominal\", title: \"Region\" },\n      { field: \"signups\", type: \"quantitative\", title: \"Signups\" },\n    ],\n  },\n  config: {\n    view: { stroke: null },\n    font: \"system-ui, -apple-system, Segoe UI, sans-serif\",\n  },\n};\n\nvegaEmbed(\"#chart\", spec, { actions: false });\n<\/script>\n<\/body>\n<\/html>\n"};
const st={lib:'d3',chart:'all',tier:'all',atk:'all'};
const opts={lib:LIBS.map(l=>[l,l]),chart:[['all','all'],['bar','bar'],['line','line'],['scatter','scatter'],['stacked_bar','stacked bar']],
 tier:[['all','all'],['1','1 Easy'],['2','2 Medium'],['3','3 Hard']],atk:[['all','all tasks'],['atk','attacked only']]};
function chips(key){const el=document.getElementById('f-'+key);
 opts[key].forEach(([v,label])=>{const b=document.createElement('button');b.className='chip';b.textContent=label;b.dataset.v=v;
  b.onclick=()=>{st[key]=v;sync();render()};el.appendChild(b)})}
function sync(){for(const k in opts)document.querySelectorAll('#f-'+k+' .chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===st[k])))}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pane(kind,label,file){const url='../pages/'+st.lib+'/'+file;
 return `<div class="pane ${kind}"><h4><span>${label}</span><a href="${url}" target="_blank" rel="noopener">${esc(file)} ↗</a></h4><iframe data-src="${url}" title="${esc(label)}"></iframe></div>`}
function fill(card){const t=TASKS[card.dataset.i];
 let h=pane('base','Clean baseline',t.clean+'.html');
 if(t.attack)h+=pane('atk','Attacked · '+t.attack,'attack_'+t.attack.replace(/^/,'')+'.html');
 card.querySelector('.panes').innerHTML=h;card.querySelector('.panes').className='panes'+(t.attack?'':' one');
 card.querySelectorAll('iframe').forEach(f=>{f.srcdoc=HTML[f.dataset.src.slice(9)]});card.dataset.lib=st.lib}
function toggle(card,force){const open=force??!card.classList.contains('open');card.classList.toggle('open',open);
 if(open&&card.dataset.lib!==st.lib)fill(card)}
let lastCat='';
function render(){const root=document.getElementById('list');root.innerHTML='';let shown=0,cat='';
 TASKS.forEach((t,i)=>{
  if(st.chart!=='all'&&t.chart!==st.chart)return; if(st.tier!=='all'&&String(t.tier)!==st.tier)return; if(st.atk==='atk'&&!t.attack)return;
  if(t.category!==cat){cat=t.category;const h=document.createElement('h2');h.textContent=cat+' · tier '+t.tier;root.appendChild(h)}
  const c=document.createElement('div');c.className='card';c.dataset.i=i;
  c.innerHTML=`<div class="head"><span class="caret">▸</span><span class="n">${t.n}</span><div class="q"><b>${esc(t.question)}</b>
   <div class="meta"><span class="tag ans">answer: ${esc(t.answer)}</span><span class="tag">${esc(t.clean)}</span>
   ${t.attack?`<span class="tag atk">ATTACK ${esc(t.attack)}</span>`:'<span class="tag">no attack</span>'}
   <span class="tag">source: ${esc(t.source)}</span></div></div></div>
   <div class="body"><div class="panes"></div>${t.attack_desc?`<p class="desc"><b>Attack:</b> ${esc(t.attack_desc)}</p>`:''}</div>`;
  c.querySelector('.head').onclick=()=>toggle(c);root.appendChild(c);shown++});
 if(!shown)root.innerHTML='<div class="empty">No tasks match these filters.</div>';
 document.getElementById('count').textContent=shown+' of '+TASKS.length+' tasks · '+TASKS.filter(t=>t.attack).length+' attacked';}
['lib','chart','tier','atk'].forEach(chips);sync();render();
document.getElementById('expand').onclick=()=>document.querySelectorAll('.card').forEach(c=>{if(TASKS[c.dataset.i].attack)toggle(c,true)});
document.getElementById('collapse').onclick=()=>document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));
</script></body></html>
